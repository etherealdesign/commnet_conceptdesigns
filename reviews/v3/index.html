`,code:`B2`,title:`Command, Control & Security Centres`,summary:`Rack, cabling and device build-out for CSOC, NOC and CID rooms, tested and commissioned to utility standard.`,evidence:`DEWA's Cyber Security Operations Centre · police surveillance for FIFA Beach Soccer 2024`,media:`media/security-operations.jpg`,mediaAlt:`Operators at a surveillance and control desk`,pageH1:`Command, Control & Security Centre Build-out, UAE`,definition:`A command room is a data centre with people in it. Our scope is the physical build: racks, panel cabling, operator positions, display walls, and the device-by-device testing and commissioning that signs the room off. We build the room to utility standard, we do not staff or operate it.`,uses:[`A1`,`A2`,`A3`,`A4`,`A6`],deliver:[`Rack and panel cabling to control-room standard`,`Operator console positions and cable management`,`Display and video-wall installation and signal distribution`,`Device installation, testing and commissioning`,`Integration with police, CID or authority feeds where required`]},{slug:`hotels-resorts`,code:`B3`,title:`Hotels & Resorts`,summary:`Guest-room and back-of-house ELV as one contract: cabling, CCTV, GRMS, IPTV, Wi-Fi, PA.`,evidence:`Atlantis The Royal · Hilton Jewel of the Creek · Occidental Al Jadaf`,media:`media/security-systems.jpg`,mediaAlt:`Hotel atrium at dusk with a single figure crossing the lobby`,pageH1:`Hotel ELV & Guest Technology Contractor, Dubai`,definition:`Hospitality is the hardest ELV programme to run: every system lands in every room, and the opening date does not move. We take guest-room and back-of-house as one contract, cabling, CCTV, room controls, television, wireless and paging, so there is one party accountable when a floor has to be signed off.`,uses:[`A1`,`A2`,`A3`,`A4`],deliver:[`Guest-room cabling, containment and riser to every key`,`Guest Room Management Systems commissioned room by room`,`IPTV/SMATV head-end and in-room distribution`,`CCTV and access control to the emirat lic Wi-Fi`,`IPTV and display distribution, then clean de-rig`]},{slug:`amc-sla`,code:`B6`,title:`AMC & Multi-year SLA`,summary:`Preventive maintenance, fault response and managed network contracts.`,evidence:`UAE Football Association since 2017 · Dubai Safari Park · DAS Holding UPS`,media:`media/enterprise-systems.jpg`,mediaAlt:`Network engineer between two rows of live racks`,pageH1:`ELV & ICT Maintenance Contracts and Managed SLA, UAE`,definition:`The part of the work that is only proven by time. Preventive maintenance visits, fault response against an agreed target, spares and managed network operation. The longest contract on our register ran eight years for the UAE Football Association, 2017 to 2024, renewed rather than re-tendered.`,uses:[`A1`,`A2`,`A3`,`A4`,`A5`],deliver:[`Scheduled preventive maintenance with written visit reports`,`Fault response against an agreed target`,`Managed network operation and monitoring`,`UPS and critical-plant maintenance`,`Spares holding and lifecycle replacement planning`]}],ih=e=>rh.find(t=>t.slug===e),ah=Object.fromEntries(rh.map(e=>[e.slug,e.media]))})),sh,ch,lh,uh,dh,fh,ph,mh,hh,gh,_h,vh,yh,bh=o((()=>{oh(),sh={title:`Mission-critical infrastructure,`,muted:`delivered as one package.`,media:`media/infrastructure-fiber.jpg`,mediaAlt:`Rows of terminated copper and fibre cabling inside a data-centre rack`},ch=`Structured cabling, networks, security systems, AV and critical power for data centres, hotels, government and command centres in the UAE. Designed, installed, certified and supported by one engineering team.`,lh={title:`Selected contracts`,slugs:[`hilton-jewel-of-the-creek`,`sharjah-police-dc`,`fifa-beach-soccer`,`orientek-containers`,`atlantis-the-royal`,`dewa-csoc`,`occidental-al-jadaf`],media:ah},uh={chip:`Compliance`,paragraphs:[`Security systems are designed to the current SIRA (Dubai) and ADMCC (Abu Dhabi) technical requirements and submitted for approval before handover.`,`Licence and registration numbers travel w
